<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DemoAPP -- Calculadora</title>
</head>
<body>
<form th:action="@{/calcular}" th:object="${calcularData}" method="post">

    <label>Primer número:</label>
    <input type="number" step="any" th:field="*{num1}" /><br>
    <p th:if="${#fields.hasErrors('num1')}" th:errors="*{num1}"></p>

    <label>Operación (+, -, *, /):</label>
    <select th:field="*{operacion}">
        <option value="+">+ Suma</option>
        <option value="-">- Resta</option>
        <option value="*">× Multiplicación</option>
        <option value="/">÷ División</option>
    </select><br>
    <p th:if="${#fields.hasErrors('operacion')}" th:errors="*{operacion}"></p>

    <label>Segundo número:</label>
    <input type="number" step="any" th:field="*{num2}" /><br>
    <p th:if="${#fields.hasErrors('num2')}" th:errors="*{num2}"></p>

    <button type="submit">Calcular</button>
</form>

<p th:if="${resultado}" >Resultado: <span th:text="${resultado}"></span></p>
</body>
</html>
